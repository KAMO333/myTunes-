<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 814 1000'><path fill='%23fa233b' d='M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.8 134.4-318 266.5-318 70.1 0 128.5 46.4 172.5 46.4 42.8 0 109.9-49.1 189.2-49.1 30.8 0 130.3 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z'/></svg>"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Premium House Music</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-container">
        <div class="logo">
          <i class="fab fa-apple"></i>
          <span>myTunes</span>
        </div>

        <ul class="nav-links">
          <li><a href="#listen-now">Listen Now</a></li>
          <li><a href="#browse">Browse</a></li>
          <li><a href="#radio">Radio</a></li>
          <li><a href="#songs">Charts</a></li>
        </ul>

        <div class="nav-right">
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
            <i class="fas fa-moon"></i>
          </button>
          <button class="hamburger" id="hamburger" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="nav-drawer" id="nav-drawer">
      <div class="nav-drawer-overlay" id="drawer-overlay"></div>
      <div class="nav-drawer-panel">
        <a href="#listen-now" class="drawer-link">Listen Now</a>
        <a href="#browse" class="drawer-link">Browse</a>
        <a href="#radio" class="drawer-link">Radio</a>
        <a href="#songs" class="drawer-link">Charts</a>
      </div>
    </div>

    <!-- Main Content -->
    <main class="app-content">
      <section id="listen-now">
        <div class="hero-card">
          <div class="hero-content">
            <p class="hero-eyebrow">Featured Station</p>
            <h1 class="hero-title">Black Coffee Live</h1>
            <p class="hero-sub">
              Experience the Grammy-winning sounds of Afro House.
            </p>
          </div>
        </div>
      </section>

      <section id="browse">
        <h2 class="section-title">The Collection</h2>
        <div class="media-grid"></div>
      </section>

      <section id="radio">
        <h2 class="section-title">Radio</h2>
        <div class="media-grid circular"></div>
      </section>

      <section id="songs">
        <h2 class="section-title">Top Charts</h2>
        <div class="song-list"></div>
      </section>
    </main>

    <!-- Player Bar -->
    <footer class="player-bar">
      <div class="player-left">
        <div id="player-art" class="mini-art"></div>
        <div class="player-track">
          <b id="current-song">Not Playing</b>
          <small id="current-artist">Select a track</small>
        </div>
      </div>

      <div class="player-center">
        <div class="controls">
          <i class="fas fa-step-backward"></i>
          <i class="fas fa-play-circle" id="master-play"></i>
          <i class="fas fa-step-forward"></i>
        </div>
        <div class="progress-container">
          <span>3:25</span>
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <span>8:46</span>
        </div>
      </div>

      <div class="player-right">
        <i class="fas fa-volume-down"></i>
        <input type="range" class="vol-slider" min="0" max="100" value="80" />
        <i class="fas fa-list-ul" style="margin-left: 6px"></i>
      </div>
    </footer>

    <script src="main.js" type="module"></script>
  </body>
</html>
